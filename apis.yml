aid: memberful
url: https://raw.githubusercontent.com/api-evangelist/memberful/refs/heads/main/apis.yml
name: Memberful
kind: company
description: Memberful is a membership and subscription platform (owned by Patreon)
  that lets independent publishers, educators, and creators sell memberships,
  subscriptions, digital downloads, podcasts, and courses on their own site while
  Memberful handles checkout, recurring billing (via Stripe), and member
  management. Its public developer surface is a GraphQL API served per account at
  https://ACCOUNT.memberful.com/api/graphql, authenticated with an API key
  (bearer token) or OAuth 2.0 access token, covering Members, Subscriptions,
  Plans/Passes, Coupons, and Orders through queries and mutations. Memberful also
  provides OAuth 2.0 single sign-on for apps and HMAC-signed webhooks for member,
  subscription, plan, order, and download events.
