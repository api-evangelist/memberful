description: >-
  FinOps view of Memberful spend. Memberful (owned by Patreon) bills a flat
  platform subscription plus a percentage transaction fee on membership revenue;
  the GraphQL API, OAuth SSO, and webhooks carry no separate metered API charge.
  On the published Standard plan that is $49/month plus a 4.9% Memberful
  transaction fee, and Stripe separately charges its own ~2.9% + $0.30 per
  transaction for payment processing. Cost therefore has a fixed component (the
  monthly base) and a variable component that scales with membership revenue and
  transaction count, so per-transaction economics get worse with many small
  payments and better with fewer large ones. Enterprise is custom-priced.
notes: >-
  The base ($49/mo) and Memberful transaction fee (4.9%) are grounded on
  Memberful's pricing page; Stripe's ~2.9% + $0.30 is a separate processor cost.
  Per-unit Enterprise rates are not reconciled. Verify current numbers on
  memberful.com/pricing.
