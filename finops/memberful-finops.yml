meters:
- name: platform_subscription
  description: Flat monthly platform fee (Standard plan $49/month).
  unit: months
  aggregation: sum
  dimensions:
  - account
- name: memberful_transaction_fee
  description: Percentage fee Memberful charges on membership transaction revenue (4.9% on Standard).
  unit: revenue
  aggregation: sum
  dimensions:
  - account
  - plan
- name: stripe_processing_fee
  description: Payment processing charged separately by Stripe (~2.9% + $0.30 per transaction).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Separate the fixed monthly base from the variable transaction fees, and track the Stripe processing cost apart from Memberful's own fee.
- name: Allocation
  description: Attribute transaction fees to the plans/passes driving revenue so cost maps to each membership product.
- name: Optimization
  description: Favor fewer, larger transactions (annual over monthly plans) to dilute the flat Stripe $0.30 per-transaction charge; consider Enterprise terms at high volume.
- name: Accountability
  description: Review monthly base plus percentage fees against membership revenue to confirm the platform stays economical as volume grows.
